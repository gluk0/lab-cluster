---
# Installs the Gateway API standard-channel CRDs (GatewayClass, Gateway,
# HTTPRoute, ...) required by the cloudflare-gateway configs and the
# HTTPRoutes defined in apps/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 24h
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: infrastructure
