# SOPS configuration for encrypting Kubernetes Secrets before commit.
#
# The private key lives in ~/.config/sops/age/keys.txt (sops finds it there
# automatically) and in the sops-age Secret in flux-system for decryption
# in-cluster. See docs/secrets.md.
#
# Usage:
#   sops --encrypt --in-place apps/<app>/secret-values.yaml
creation_rules:
  - path_regex: .*\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1khuydqqhtu0wj8nx6kgkfgw6wrvff09p864fzjsw34vtp0pjr50q8dvpcd
