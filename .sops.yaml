# SOPS configuration for encrypting Kubernetes Secrets before commit.
#   kubectl create secret generic sops-age -n flux-system \
#     --from-file=age.agekey
#   sops --encrypt --in-place apps/<app>/secret-values.yaml
creation_rules:
  - path_regex: .*\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq  # REPLACE with your age public key
