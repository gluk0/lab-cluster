---
# ztunnel is the per-node DaemonSet that handles ambient mesh dataplane
# traffic (mTLS, L4 authorization) for pods without sidecars. Required
# for Istio ambient mode.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  interval: 30m
  chart:
    spec:
      chart: ztunnel
      version: 1.24.0
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 12h
  dependsOn:
    - name: istio-base
    - name: istio-cni
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
