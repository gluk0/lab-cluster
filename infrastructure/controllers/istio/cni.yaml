---
# istio-cni replaces the per-pod istio-init container with a privileged,
# host-level DaemonSet that programs traffic redirection. This avoids
# istio-init's iptables-restore failing against the "nat" table on Talos
# nodes running Cilium with kubeProxyReplacement (no legacy nat chains
# pre-created for other tools to hook into).
#
# Ambient mode is enabled here: workloads no longer get sidecars injected;
# the CNI plugin instead redirects pod traffic to the shared ztunnel
# DaemonSet (see ztunnel.yaml), which avoids per-pod iptables entirely.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cni
      version: 1.24.0
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 12h
  dependsOn:
    - name: istio-base
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cni:
      cniBinDir: /opt/cni/bin
      cniConfDir: /etc/cni/net.d
      chained: true
      cniConfFileName: 05-cilium.conflist
      privileged: true
      ambient:
        enabled: true
      excludeNamespaces:
        - istio-system
        - kube-system
