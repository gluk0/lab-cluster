---
# EXAMPLE ONLY — do not commit real values unencrypted.
#
# 1. Copy to secret-values.yaml and set a real password.
# 2. Encrypt it:   sops --encrypt --in-place apps/nightscout/secret-values.yaml
# 3. Add secret-values.yaml to apps/nightscout/kustomization.yaml resources.
#
# The apps Flux Kustomization decrypts it with the sops-age key
# (see .sops.yaml at the repo root for key setup).
apiVersion: v1
kind: Secret
metadata:
  name: nightscout-secret-values
  namespace: nightscout
stringData:
  values.yaml: |
    mongodb:
      auth:
        password: "CHANGE-ME"
